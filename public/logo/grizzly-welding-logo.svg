<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <radialGradient id="core" cx="50%" cy="42%" r="65%">
      <stop offset="0" stop-color="#7a1a10"/>
      <stop offset="0.6" stop-color="#3a0c08"/>
      <stop offset="1" stop-color="#1a0605"/>
    </radialGradient>
    <linearGradient id="molten" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb08a"/>
      <stop offset="0.45" stop-color="#ff3b1f"/>
      <stop offset="1" stop-color="#a80f08"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4f57"/>
      <stop offset="0.5" stop-color="#2a2d33"/>
      <stop offset="1" stop-color="#16181c"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a0805"/>
      <stop offset="1" stop-color="#120302"/>
    </linearGradient>
    <pattern id="paisley" width="44" height="44" patternUnits="userSpaceOnUse">
      <rect width="44" height="44" fill="#c4160d"/>
      <path d="M 12 8 C 20 8 22 18 14 22 C 10 18 6 12 12 8 Z" fill="none" stroke="#fbe9e4" stroke-width="2.2"/>
      <circle cx="13" cy="15" r="2" fill="#fbe9e4"/>
      <circle cx="34" cy="32" r="3" fill="#fbe9e4"/>
      <circle cx="34" cy="32" r="6.5" fill="none" stroke="#fbe9e4" stroke-width="1.6"/>
      <circle cx="32" cy="10" r="1.6" fill="#fbe9e4"/>
      <circle cx="8" cy="36" r="1.6" fill="#fbe9e4"/>
    </pattern>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7d8691"/>
      <stop offset="0.5" stop-color="#e6eaee"/>
      <stop offset="1" stop-color="#6b737d"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3e45"/>
      <stop offset="0.5" stop-color="#1e2024"/>
      <stop offset="1" stop-color="#0e0f11"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c97a68"/>
      <stop offset="0.5" stop-color="#f3c2b2"/>
      <stop offset="1" stop-color="#b8665a"/>
    </linearGradient>
    <radialGradient id="arcGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#ffd2c2"/>
      <stop offset="0.55" stop-color="#ff3b1f" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ff3b1f" stop-opacity="0"/>
    </radialGradient>
    <path id="topArc" d="M 160 500 A 340 340 0 0 1 840 500"/>
    <path id="botArc" d="M 80 500 A 420 420 0 0 0 920 500"/>
  </defs>

  <!-- outer badge -->
  <circle cx="500" cy="500" r="480" fill="#140a09"/>
  <circle cx="500" cy="500" r="462" fill="none" stroke="url(#molten)" stroke-width="10"/>
  <circle cx="500" cy="500" r="440" fill="none" stroke="#3a1a16" stroke-width="3"/>
  <circle cx="500" cy="500" r="300" fill="url(#core)" stroke="url(#molten)" stroke-width="10"/>

  <!-- ring text -->
  <text font-family="Impact, 'Anton', 'Arial Black', sans-serif" font-size="88" font-weight="900" fill="#f4eeec" letter-spacing="6" text-anchor="middle">
    <textPath href="#topArc" startOffset="50%">GRIZZLY WELDING</textPath>
  </text>
  <text font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="50" fill="#ff3b1f" letter-spacing="6" text-anchor="middle">
    <textPath href="#botArc" startOffset="50%">FABRICATION &amp; REPAIR</textPath>
  </text>
  <g fill="url(#molten)">
    <polygon points="56,500 70,488 84,500 70,512"/>
    <polygon points="916,500 930,488 944,500 930,512"/>
  </g>

  <!-- grizzly -->
  <g stroke-linejoin="round">
    <!-- ears -->
    <circle cx="385" cy="322" r="46" fill="#1b1512" stroke="#0b0908" stroke-width="6"/>
    <circle cx="615" cy="322" r="46" fill="#1b1512" stroke="#0b0908" stroke-width="6"/>
    <circle cx="387" cy="326" r="21" fill="#6b4a33"/>
    <circle cx="613" cy="326" r="21" fill="#6b4a33"/>
    <!-- torch cable -->
    <path d="M 640 522 C 610 570 642 625 612 668" fill="none" stroke="#0b0908" stroke-width="22" stroke-linecap="round"/>
    <path d="M 640 522 C 610 570 642 625 612 668" fill="none" stroke="#2a2d33" stroke-width="12" stroke-linecap="round"/>
    <!-- head -->
    <path d="M 500 335 C 560 335 625 350 640 412 L 658 480 C 668 545 620 600 560 625 L 500 645 L 440 625 C 380 600 332 545 342 480 L 360 412 C 375 350 440 335 500 335 Z"
          fill="#2b211b" stroke="#0b0908" stroke-width="8"/>
    <path d="M 344 500 L 322 530 L 352 526 L 338 560 L 370 546 Z" fill="#2b211b" stroke="#0b0908" stroke-width="6"/>
    <path d="M 656 500 L 678 530 L 648 526 L 662 560 L 630 546 Z" fill="#2b211b" stroke="#0b0908" stroke-width="6"/>
    <!-- muzzle -->
    <path d="M 500 485 C 555 485 585 520 580 560 C 575 600 540 618 500 622 C 460 618 425 600 420 560 C 415 520 445 485 500 485 Z" fill="#8a6446" stroke="#0b0908" stroke-width="6"/>
    <path d="M 500 500 C 540 500 562 518 562 540 L 500 555 L 438 540 C 438 518 460 500 500 500 Z" fill="#a37a57"/>
    <path d="M 462 518 C 480 508 520 508 538 518 C 540 535 520 552 500 556 C 480 552 460 535 462 518 Z" fill="#0b0908"/>
    <ellipse cx="488" cy="522" rx="10" ry="5" fill="#5a5f66"/>
    <path d="M 500 556 L 500 574" stroke="#0b0908" stroke-width="6" stroke-linecap="round"/>
    <path d="M 456 596 C 470 578 530 578 544 596 C 530 604 470 604 456 596 Z" fill="#0b0908"/>
    <path d="M 468 588 L 476 604 L 482 586 Z M 532 588 L 524 604 L 518 586 Z" fill="#f2efe8"/>

    <!-- bandana -->
    <path d="M 655 392 C 690 400 715 420 728 440 C 708 438 690 430 672 418 Z" fill="url(#paisley)" stroke="#0b0908" stroke-width="6"/>
    <path d="M 655 392 C 684 414 700 444 704 474 C 684 462 668 440 660 418 Z" fill="url(#paisley)" stroke="#0b0908" stroke-width="6"/>
    <path d="M 350 428 C 346 360 408 314 500 312 C 592 314 654 360 650 428 Z" fill="url(#paisley)" stroke="#0b0908" stroke-width="8"/>
    <path d="M 372 372 C 420 340 580 340 628 372" fill="none" stroke="#7a0b06" stroke-width="3" stroke-opacity="0.7"/>
    <ellipse cx="656" cy="396" rx="18" ry="16" fill="url(#paisley)" stroke="#0b0908" stroke-width="6"/>

    <!-- welding mask -->
    <path d="M 356 420 C 362 378 420 360 500 360 C 580 360 638 378 644 420 L 652 482 C 612 500 560 506 500 506 C 440 506 388 500 348 482 Z"
          fill="url(#shell)" stroke="#0b0908" stroke-width="8"/>
    <path d="M 380 392 C 420 376 580 376 620 392" fill="none" stroke="#6a717b" stroke-width="5" stroke-linecap="round"/>
    <!-- lens -->
    <rect x="418" y="414" width="164" height="62" rx="9" fill="#0b0908"/>
    <rect x="428" y="422" width="144" height="46" rx="5" fill="url(#lens)"/>
    <!-- glowing eyes behind the lens -->
    <path d="M 442 436 L 488 446 L 476 458 L 448 452 Z" fill="url(#molten)"/>
    <path d="M 558 436 L 512 446 L 524 458 L 552 452 Z" fill="url(#molten)"/>
    <path d="M 436 466 L 470 424 L 486 424 L 452 466 Z" fill="#ffffff" fill-opacity="0.12"/>
    <!-- pivot bolts -->
    <circle cx="362" cy="452" r="12" fill="url(#molten)" stroke="#0b0908" stroke-width="4"/>
    <circle cx="638" cy="452" r="12" fill="url(#molten)" stroke="#0b0908" stroke-width="4"/>
    <!-- TIG torch held in paw -->
    <g transform="translate(765 538) rotate(10)">
      <!-- handle -->
      <rect x="-132" y="-14" width="122" height="28" rx="12" fill="url(#grip)" stroke="#0b0908" stroke-width="6"/>
      <path d="M -122 -12 V 12 M -40 -12 V 12 M -28 -12 V 12" stroke="#4a4f57" stroke-width="3"/>
      <!-- back cap -->
      <rect x="-13" y="-82" width="26" height="66" rx="10" fill="url(#grip)" stroke="#0b0908" stroke-width="6"/>
      <!-- torch body -->
      <rect x="-20" y="-22" width="40" height="44" rx="6" fill="url(#metal)" stroke="#0b0908" stroke-width="6"/>
      <!-- ceramic cup -->
      <path d="M -17 22 L 17 22 L 12 56 L -12 56 Z" fill="url(#cup)" stroke="#0b0908" stroke-width="6" stroke-linejoin="round"/>
      <!-- tungsten -->
      <rect x="-3" y="56" width="6" height="16" fill="#c9ced4" stroke="#0b0908" stroke-width="2"/>
      <!-- arc -->
      <circle cx="0" cy="80" r="34" fill="url(#arcGlow)"/>
      <g stroke="#ffd2c2" stroke-width="4" stroke-linecap="round">
        <line x1="0" y1="80" x2="-34" y2="96"/><line x1="0" y1="80" x2="34" y2="98"/>
        <line x1="0" y1="80" x2="-40" y2="74"/><line x1="0" y1="80" x2="42" y2="72"/>
        <line x1="0" y1="80" x2="-12" y2="112"/><line x1="0" y1="80" x2="14" y2="114"/>
      </g>
      <!-- paw gripping handle -->
      <ellipse cx="-92" cy="2" rx="34" ry="28" fill="#2b211b" stroke="#0b0908" stroke-width="6"/>
      <path d="M -100 -12 C -86 -10 -74 -10 -64 -11 M -102 1 C -88 0 -74 0 -60 1 M -100 14 C -86 13 -74 13 -64 13" fill="none" stroke="#0b0908" stroke-width="4" stroke-linecap="round"/>
      <path d="M -62 -16 L -46 -12 L -60 -6 Z M -58 -4 L -42 0 L -58 6 Z M -62 8 L -46 12 L -60 18 Z" fill="#f2efe8" stroke="#0b0908" stroke-width="2" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- banner -->
  <g>
    <path d="M 225 660 L 775 660 L 800 702 L 775 744 L 225 744 L 200 702 Z" fill="#0e0606" stroke="url(#molten)" stroke-width="6" stroke-linejoin="round"/>
    <text x="500" y="716" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="38" fill="#f4eeec" letter-spacing="2" text-anchor="middle">ALUMINUM <tspan fill="#ff3b1f">•</tspan> TIG <tspan fill="#ff3b1f">•</tspan> STICK</text>
  </g>
</svg>
